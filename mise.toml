# mise config scoped to this project.
# Loaded automatically when you cd into this directory (requires `mise activate`
# in your shell rc, or use `mise exec` / `mise run`).
#
# Quick start:
#   mise install        # install all tools below + create the Python venv
#   mise run setup      # sync Python deps into .venv via uv
#   mise run verify     # confirm AWS auth with the project profile

[tools]
python = "3.12"
opentofu = "1.13"
aws-cli = "latest"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

# All per-run / per-account values live in a single git-ignored `.env` file at
# the repo root. Copy the template and edit it — nothing else here needs touching:
#   cp .env.example .env   # then set AWS_PROFILE / AWS_REGION / ...
# mise sources `.env` first; the AWS_* lines below only supply fallbacks via
# `default`, so whatever `.env` (or your shell) sets wins. A missing `.env` is
# fine — the defaults apply.
_.file = ".env"

# Point the AWS CLI/SDKs at project-local config so the profile is scoped here
# and your global ~/.aws is left untouched.
AWS_CONFIG_FILE = "{{config_root}}/.aws/config"
AWS_SHARED_CREDENTIALS_FILE = "{{config_root}}/.aws/credentials"

# Fallbacks only. `.env` (or the shell) overrides these; `default` keeps any
# existing non-empty value and applies the fallback only when unset.
AWS_PROFILE = { default = "kiro-provisioning" }

# Region split: KIRO_REGION is the sign-in region (Kiro-only), IDC_REGION is
# where all AWS resources are provisioned.
# Kiro sign-in region (Kiro-only). Default is Kiro's single supported region.
KIRO_REGION = { default = "us-east-1" }
# Resource-provisioning region. Default is the operator's target region.
IDC_REGION = { default = "ap-southeast-1" }
# AWS_REGION tracks IDC_REGION so every AWS CLI/SDK/OpenTofu call targets the
# provisioning region. `.env` (or the shell) may still override IDC_REGION.
AWS_REGION = "{{ env.IDC_REGION }}"
# Mirror AWS_REGION so the two never diverge, whatever .env/shell set it to.
AWS_DEFAULT_REGION = "{{ env.AWS_REGION }}"

# =============================================================================
# === shared / toolchain ===
# =============================================================================

[tasks.setup]
description = "Install locked Python dependencies into .venv"
run = "uv sync"

[tasks.lock]
description = "Resolve and update uv.lock from pyproject.toml"
run = "uv lock"

# --- First-run bootstrap -----------------------------------------------------
# Bridges the gap between the quick start and RUNBOOK.md. The `cp` of the
# example config files is a manual step (see README quick start); only the
# AWS profile generation is wrapped here, since it runs `aws configure`.

[tasks.aws-configure]
description = "Create/update the project-local AWS profile via `aws configure` (writes to .aws/, not ~/.aws)"
run = """
set -eu
echo "Configuring AWS profile '$AWS_PROFILE' into project-local .aws/ (region: $AWS_REGION)."
echo "Have your access key id + secret access key ready (from creds/)."
aws configure --profile "$AWS_PROFILE"
"""

[tasks.verify]
description = "Verify AWS auth with the project profile"
run = "aws sts get-caller-identity"

# =============================================================================
# === backend/ stack ===
# =============================================================================
# Remote state backend (one-time, run BEFORE the subscription stack).
# Remote S3 state is REQUIRED. `tofu destroy` only deletes what is in its state,
# and local state is git-ignored, so teardown from a fresh clone a month later
# would orphan everything. These tasks create the S3 bucket + DynamoDB lock
# table (the backend/ stack keeps its OWN local state — chicken-and-egg) and
# then WRITE subscription/terraform/backend.hcl for you from the bootstrap
# output — the bucket name is derived from your account id, so there is nothing
# to fill in. subscription/terraform/backend.tf is tracked + value-free, so no
# activation copy is needed; see subscription/RUNBOOK.md step 1b. provision.py
# fails closed until backend.hcl exists. Prefer manual control?
# `cp subscription/terraform/backend.hcl.example subscription/terraform/backend.hcl`
# and edit it instead — the escape hatch backend.hcl.example exists for that.

[tasks.backend-bootstrap-plan]
description = "DRY RUN: tofu init + plan for the S3 state bucket + lock table (creates nothing)"
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu plan
"""

[tasks.backend-bootstrap]
description = "One-time (REQUIRED): create the S3 state bucket + lock table AND write the subscription/, claim-service/, foundation/, and governance/ backend.hcl files (prompts to approve)."
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu apply
# Only reached after a clean apply (set -eu). The bootstrap dir is
# backend/terraform, so ../../<stack>/terraform/backend.hcl is where each
# stack's `tofu init -backend-config=backend.hcl` reads it. Both stacks share
# the one bucket + lock table and differ only by state key, so write both from
# the matching outputs. `-raw` emits the heredoc body without surrounding quotes.
tofu output -raw backend_hcl > ../../subscription/terraform/backend.hcl
echo "wrote subscription/terraform/backend.hcl"
cat ../../subscription/terraform/backend.hcl
tofu output -raw backend_hcl_claim_service > ../../claim-service/terraform/backend.hcl
echo "wrote claim-service/terraform/backend.hcl"
cat ../../claim-service/terraform/backend.hcl
tofu output -raw backend_hcl_foundation > ../../foundation/terraform/backend.hcl
echo "wrote foundation/terraform/backend.hcl"
cat ../../foundation/terraform/backend.hcl
tofu output -raw backend_hcl_governance > ../../governance/terraform/backend.hcl
echo "wrote governance/terraform/backend.hcl"
cat ../../governance/terraform/backend.hcl
"""

[tasks.backend-destroy]
description = "Delete the S3 state bucket + lock table (empties versioned state automatically; prompts to confirm)"
dir = "backend/terraform"
run = """
set -eu
# Apply force_destroy=true to the bucket FIRST so the provider is allowed to
# empty a versioned bucket on destroy; then destroy. Passing -var inline means
# no terraform.tfvars edit is needed — this stays a single, repeatable step for
# every future project. Both steps prompt before mutating.
tofu apply -var force_destroy=true
tofu destroy -var force_destroy=true
"""

[tasks.backend-destroy-workshop]
description = "Purge ONE finished workshop's leftover remote state: all S3 object versions + delete markers under workshops/<WORKSHOP_ID>/ and its DynamoDB lock rows. Surgical and safe while other workshops are live — never touches the shared bucket, the lock table, or any other workshop. Requires WORKSHOP_ID; dry-run by default (set APPLY=1 to delete, which prompts for the typed phrase). Contrast with backend-destroy, which deletes the WHOLE shared bucket + lock table and must run only when ALL workshops are done."
dir = "backend/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard: sets WID; fails closed if unset/whitespace/invalid.
require_workshop_id
# backend.hcl names the shared bucket + lock table the script reads from.
require_backend_hcl "backend/terraform/backend.hcl" \\
  "Run the backend bootstrap first (it writes this file):" \\
  "  mise run backend-bootstrap" \\
  "or copy the template by hand: cp backend.hcl.example backend.hcl"
# A residual 'key' in backend.hcl conflicts with the init-time key convention.
reject_residual_key
# ../scripts/... is relative to dir backend/terraform -> resolves to
# backend/scripts/destroy_workshop_state.sh. The typed-phrase gate lives ONLY in
# the APPLY branch so the script stays non-interactive (tests drive --apply).
if [ "${APPLY:-0}" = "1" ]; then
  printf 'WARNING: about to PURGE workshop "%s" remote state (all S3 versions + delete markers under workshops/%s/ and its DynamoDB lock rows).\\n' "$WID" "$WID"
  require_typed_phrase "destroy-workshop-state" "deleting nothing."
  ../scripts/destroy_workshop_state.sh "$WID" --apply
else
  printf 'DRY RUN: listing what would be purged for workshop "%s" (set APPLY=1 to delete).\\n' "$WID"
  ../scripts/destroy_workshop_state.sh "$WID"
fi
"""

# =============================================================================
# === subscription/ stack ===
# =============================================================================
# Provisioning entrypoints — see subscription/RUNBOOK.md. These drive only the
# AUTOMATABLE steps; the entrypoint prints the console-only steps (MFA optional,
# enable Kiro, assign tier, one-time passwords) as a checklist. Nothing mutates
# the account by default:
#   - subscription-plan is a safe DRY RUN (tofu init + plan, reports only).
#   - subscription-apply applies (tofu apply) and still prompts for approval.
# Run them yourself when ready; they are not automatic.

[tasks.subscription-plan]
description = "DRY RUN: tofu init + plan for the IdC provisioning (no changes)"
dir = "subscription/scripts"
run = """
set -eu
# Pass the Kiro sign-in region to Terraform via TF_VAR_kiro_region (mirrors how
# claim-deploy exports TF_VAR_workshop_code). AWS_REGION (= IDC_REGION) still
# drives the provider; this only feeds the kiro_region manifest field.
export TF_VAR_kiro_region="$KIRO_REGION"
python provision.py
"""

[tasks.subscription-apply]
description = "Apply: create a workshop's IdC users + groups + memberships + assignments, then render credentials (requires WORKSHOP_ID; prompts to approve)"
dir = "subscription/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
# provision only soft-checks existence (backend.hcl may be absent here);
# reject_residual_key is a no-op when the file is missing.
reject_residual_key

SUB_KEY="workshops/${WID}/subscription/terraform.tfstate"
# Collision warning (not a hard stop): the subscription state key already exists
# for this workshop (R8.5). Re-provisioning an existing workshop is legitimate.
BUCKET="$(grep -E '^[[:space:]]*bucket' backend.hcl | sed -E 's/.*= *"(.*)".*/\\1/')"
if [ -n "$BUCKET" ] && aws s3api head-object --bucket "$BUCKET" --key "$SUB_KEY" >/dev/null 2>&1; then
  echo "WARNING: subscription state key already exists -> $SUB_KEY" >&2
  echo "WARNING: workshop '$WID' may already be provisioned; proceeding." >&2
fi

# Thread the workshop namespace to OpenTofu (R6.4, R8.2). Pass the Kiro sign-in
# region via TF_VAR_kiro_region too (AWS_REGION = IDC_REGION still drives the
# provider; this only feeds the kiro_region manifest field).
export TF_VAR_workshop_id="$WID"
export TF_VAR_kiro_region="$KIRO_REGION"

# Reconfigure the backend to THIS workshop's key BEFORE apply (R6.2) and fail
# closed if init exits non-zero (R6.3).
tofu_init_keyed "$SUB_KEY" "backend reconfiguration failed; not applying."
tofu apply

# Only reached after a clean apply (set -eu). Export the manifest and render
# credentials.md — the behavior provision.py drives after an apply. Run both
# directly here so the single reconfigured backend init above is authoritative
# (a second un-reconfigured `tofu init` from provision.py would clobber the
# workshop-keyed backend pointer).
mkdir -p ../output
tofu output -json provisioning_manifest > ../output/manifest.json
echo "wrote ../output/manifest.json"
( cd ../scripts && python provision.py --render-only )
"""

[tasks.subscription-render]
description = "Re-render output/credentials.md from an existing manifest (pass --otp-csv as needed)"
dir = "subscription/scripts"
run = "python provision.py --render-only"

# Render output/credentials.md after you have filled in output/otps.csv with the
# one-time passwords collected from the console (header: username,otp). The
# sign-in URL always comes from the manifest (derived from the identity store id
# by `tofu output`), so there is nothing to paste by hand.
[tasks.subscription-credentials]
description = "Render output/credentials.md from output/otps.csv (sign-in URL comes from the manifest)"
dir = "subscription/scripts"
run = """
set -eu
if [ ! -f ../output/otps.csv ]; then
  echo "ERROR: ../output/otps.csv not found." >&2
  echo "Collect one-time passwords from the console (RUNBOOK.md step 5) into a" >&2
  echo "CSV with the header 'username,otp', e.g.:" >&2
  echo "" >&2
  echo "  username,otp" >&2
  echo "  kiro-user-01,Ab12..." >&2
  echo "" >&2
  echo "then re-run: mise run subscription-credentials" >&2
  exit 1
fi
python provision.py --render-only --otp-csv ../output/otps.csv
"""

# Teardown entrypoints — see subscription/TEARDOWN.md. Nothing here mutates the
# account by default:
#   - subscription-teardown-plan is a safe DRY RUN (Option A discovery, reports only).
#   - subscription-destroy runs `tofu destroy` (Option B) and still prompts for yes.
# Run them yourself when you are ready to clean up; they are not automatic.

[tasks.subscription-teardown-plan]
description = "DRY RUN: discover what teardown would delete (Option A, no changes)"
dir = "subscription/scripts"
run = "python teardown.py"

[tasks.subscription-teardown-run]
description = "Option A fallback: delete this workshop's IdC users/groups/memberships (prompts to confirm; never deletes the shared org instance)"
dir = "subscription/scripts"
run = "python teardown.py --delete"

[tasks.subscription-destroy]
description = "Option B primary: tofu destroy a workshop's subscription state (requires WORKSHOP_ID; prompts to confirm)"
dir = "subscription/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key

export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's key BEFORE destroy (R6.2); fail closed (R6.3).
tofu_init_keyed "workshops/${WID}/subscription/terraform.tfstate" "backend reconfiguration failed; not destroying."
tofu destroy
"""

# =============================================================================
# === claim-service/ stack ===
# =============================================================================
# Self-serve credential claim service — see claim-service/README.md. Tasks are
# ordered to match the operator lifecycle:
#
#   test  ->  deploy-plan  ->  deploy  ->  seed-plan  ->  seed
#         ->  (workshop runs)  ->  audit  ->  destroy
#
# Conventions mirror the subscription/ stack: every mutating step has a safe
# *-plan / dry-run sibling that reports without changing anything, and the
# apply/seed/destroy steps prompt before they mutate. Nothing here runs
# automatically.
#
# Secrets: the Function URL is public (authorization NONE); access is gated in
# the handler by WORKSHOP_CODE + the per-IP cap. Set WORKSHOP_CODE in the
# git-ignored .env (see .env.example). OpenTofu reads it via TF_VAR_workshop_code,
# which these tasks export from WORKSHOP_CODE so the sensitive var is never
# written to a tracked file or passed on the command line.

# --- 1. Test (local, no AWS) -------------------------------------------------
[tasks.claim-test]
description = "Run the claim-service test suite (pytest + Hypothesis + moto; no AWS needed)"
dir = "claim-service"
run = "uv run --group dev pytest -q"

# --- 2. Deploy ---------------------------------------------------------------
# backend.hcl must exist first (reuses the shared state bucket from backend/):
#   cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl
#   # then set your 12-digit <account_id> in the bucket name
# See claim-service/README.md "Deploy". WORKSHOP_CODE must be set in .env.

[tasks.claim-deploy-plan]
description = "DRY RUN: tofu init + plan for the claim service (creates nothing)"
dir = "claim-service/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
require_backend_hcl "claim-service/terraform/backend.hcl" \
  "Create it from the template (reuses the shared state bucket):" \
  "  cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl" \
  "then set your 12-digit <account_id> in the bucket name and re-run."
# --- WORKSHOP_ID guard (namespace; previews the same per-workshop state apply uses) ---
require_workshop_id
# --- WORKSHOP_CODE guard (access gate; distinct from the namespace) ------------
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_CODE=my-workshop-2026" >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key.
reject_residual_key

export TF_VAR_workshop_id="$WID"
export TF_VAR_workshop_code="$WORKSHOP_CODE"
# Reconfigure to THIS workshop's claim-service key BEFORE plan; fail closed.
tofu_init_keyed "workshops/${WID}/claim-service/terraform.tfstate" "backend init failed; not planning."
tofu plan
"""

[tasks.claim-deploy]
description = "Apply: create a workshop's DynamoDB table, Lambda, and Function URL, then print the claim URL (requires WORKSHOP_ID + WORKSHOP_CODE; prompts to approve)"
dir = "claim-service/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
require_backend_hcl "claim-service/terraform/backend.hcl" \
  "(see claim-deploy-plan)"
# --- WORKSHOP_ID guard (namespace; R6.1, R6.7, R8.4) ---------------------------
require_workshop_id
# --- WORKSHOP_CODE guard (access gate; distinct from the namespace, R9.5) ------
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set (see .env.example)." >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key

# Thread both values to OpenTofu as two distinct TF vars (R6.4, R8.2, R9.5).
export TF_VAR_workshop_id="$WID"
export TF_VAR_workshop_code="$WORKSHOP_CODE"
# Reconfigure to THIS workshop's claim-service key BEFORE apply (R6.2); fail
# closed (R6.3).
tofu_init_keyed "workshops/${WID}/claim-service/terraform.tfstate" "backend reconfiguration failed; not applying."
tofu apply
# Only reached after a clean apply (set -eu). Print the public HTTPS URL
# participants hit — put it behind the workshop QR code / short link.
echo ""
echo "Claim service deployed. Participant URL (HTTPS):"
tofu output -raw claim_url
echo ""
"""

[tasks.claim-url]
description = "Print the deployed claim URL (the HTTPS Function URL for the QR code / short link)"
dir = "claim-service/terraform"
run = "tofu output -raw claim_url"

# --- 3. Seed the pool --------------------------------------------------------
# Reads the subscription/ outputs (otps.csv + manifest.json) and reports one
# CRED# item per credential. --apply is required to write; without it (as here)
# the script is a dry run that classifies rows and writes nothing. The table
# name is derived from WORKSHOP_ID as credential-claim-<WORKSHOP_ID> — the SAME
# namespaced name the stack's local.name uses and that `claim-seed` writes to —
# so the dry-run report names the exact table a later --apply would target
# (replacing the old static `credential-claim-service` name). WORKSHOP_ID is
# required so the dry run names the real table; set it in the git-ignored .env.

[tasks.claim-seed-plan]
description = "DRY RUN: classify otps.csv rows and report what would be seeded (writes nothing)"
dir = "claim-service/scripts"
run = """
set -eu
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --workshop-id "${WORKSHOP_ID:-}"
"""

[tasks.claim-seed]
description = "Seed a workshop's claim pool from the subscription/ outputs (writes CRED# items; requires WORKSHOP_ID; conditional, safe to re-run)"
dir = "claim-service/scripts"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# Derive this workshop's table name (R6.5, R7.6); the script errors if that
# workshop's table does not exist, touching no other workshop's table (R7.7).
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --table "credential-claim-${WID}" \
  --apply
"""

# --- 4. Audit (after the workshop, before teardown) --------------------------
[tasks.claim-audit]
description = "Export who claimed what for a workshop to a git-ignored CSV under claim-service/output/ (PII — not committed; requires WORKSHOP_ID)"
dir = "claim-service/scripts"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# Derive this workshop's table name (R6.6, R7.6); the script errors if that
# workshop's table does not exist, reading no other workshop's table (R7.7).
TABLE_NAME="credential-claim-${WID}" python export_audit.py
"""

# --- 5. Destroy --------------------------------------------------------------
[tasks.claim-destroy]
description = "Tear down a workshop's claim service (table, Lambda, Function URL); never touches subscription/ identities (requires WORKSHOP_ID; prompts to confirm)"
dir = "claim-service/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key

# workshop_id namespaces the resources; workshop_code is required by the stack
# even to destroy (it is a required var), so export it from the env so destroy
# does not prompt. The two stay distinct values (R9.4, R9.5).
export TF_VAR_workshop_id="$WID"
export TF_VAR_workshop_code="${WORKSHOP_CODE:-unused-at-destroy}"
# Reconfigure to THIS workshop's claim-service key BEFORE destroy (R6.2); fail
# closed (R6.3).
tofu_init_keyed "workshops/${WID}/claim-service/terraform.tfstate" "backend reconfiguration failed; not destroying."
tofu destroy
"""

# =============================================================================
# === foundation/ stack ===
# =============================================================================
# The once-per-management-account shared layer. It ADOPTS (reads) the management
# account's organization IdC instance AND CREATES the shared primitives every
# workshop's governance stack consumes: the budgets execution role and the two
# SCP policy objects (Kiro guardrail + deny-all freeze). Read/created ONCE and
# reused across every workshop (NOT per workshop). Runs in the management
# account; AWS_PROFILE must be a management-account profile. Excluded from every
# per-workshop provision/teardown task. backend.hcl must exist first (written by
# `mise run backend-bootstrap`, same shared bucket as the other stacks).

[tasks.foundation-plan]
description = "DRY RUN: tofu init + plan (reads the org IdC instance; shows the shared budgets role + 2 SCP policies to create)"
dir = "foundation/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
require_backend_hcl "foundation/terraform/backend.hcl" \
  "Run the backend bootstrap first (it writes this file):" \
  "  mise run backend-bootstrap" \
  "or copy the template by hand: cp backend.hcl.example backend.hcl"
reject_residual_key
tofu_init_keyed "foundation/terraform.tfstate" "backend init failed; not planning."
tofu plan
"""

[tasks.foundation-apply]
description = "Apply: read the org IdC instance, create the shared budgets role + 2 SCP policies, and print the wire-forward exports (prompts to approve)"
dir = "foundation/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
require_backend_hcl "foundation/terraform/backend.hcl" \
  "(see foundation-plan)"
reject_residual_key
tofu_init_keyed "foundation/terraform.tfstate" "backend init failed; not applying."
tofu apply
# Only reached after a clean apply (set -eu). Surface the values to wire forward.
echo ""
echo "Foundation applied. Wire these into the subscription stack (IdC handoff):"
echo "  export TF_VAR_idc_instance_arn=\"$(tofu output -raw instance_arn)\""
echo "  export TF_VAR_identity_store_id=\"$(tofu output -raw identity_store_id)\""
echo "Sign-in URL: $(tofu output -raw sign_in_url)  (region: $(tofu output -raw region))"
echo ""
echo "Wire these into the governance stack (shared-primitives handoff):"
echo "  export TF_VAR_budgets_execution_role_arn=\"$(tofu output -raw budgets_execution_role_arn)\""
echo "  export TF_VAR_kiro_guardrail_scp_id=\"$(tofu output -raw kiro_guardrail_scp_id)\""
echo "  export TF_VAR_freeze_scp_id=\"$(tofu output -raw freeze_scp_id)\""
"""

[tasks.foundation-destroy]
description = "No-op: foundation adopts the org IdC instance read-only and owns nothing to destroy. Disabling IdC is a management-account console action, never a repo task."
dir = "foundation/terraform"
run = """
set -eu
# Documented no-op. Foundation ADOPTS the organization's IdC instance read-only
# (a `data "aws_ssoadmin_instances"` source), so it is NOT in Terraform state and
# there is nothing for this stack to destroy. This task therefore runs no tofu
# (no init, no plan, no apply, no destroy) and deletes nothing.
#
# Disabling the organization IdC instance itself is a deliberate management-
# account console action, never a repo task.
echo "foundation-destroy is a no-op: foundation adopts the org IdC instance"
echo "read-only and owns nothing to destroy. Nothing was deleted."
echo "Disabling IdC is a management-account console action, not a repo task."
"""

# =============================================================================
# === governance/ stack ===
# =============================================================================
# Standalone, MANAGEMENT-ACCOUNT-scoped stack: one OU per workshop, a Kiro
# guardrail SCP on the OU, an unattached deny-all freeze SCP, a least-privilege
# budgets execution role, and per-account budgets whose breach AUTOMATICALLY
# attaches the freeze SCP to the single breaching account. High blast radius —
# apply mutates the live AWS Organizations management account. backend.hcl must
# exist first (written by `mise run backend-bootstrap`, same shared bucket as
# the other stacks). Namespaced per workshop by WORKSHOP_ID, exactly like the
# subscription/ and claim-service/ stacks. There is intentionally NO un-freeze
# task: recovering a frozen account is a deliberate manual detach (see
# governance/RUNBOOK.md).

[tasks.governance-plan]
description = "DRY RUN: tofu init + plan for a workshop's governance stack (requires WORKSHOP_ID; creates nothing)"
dir = "governance/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# --- Shared-primitive wire-forward guard (from foundation/) --------------------
# These three come from foundation/ (OpenTofu picks TF_VAR_* up automatically).
# They have no defaults, so fail closed with a pointer to foundation-apply if any
# is missing rather than letting tofu prompt for them.
MISSING=""
[ -z "${TF_VAR_budgets_execution_role_arn:-}" ] && MISSING="$MISSING TF_VAR_budgets_execution_role_arn"
[ -z "${TF_VAR_kiro_guardrail_scp_id:-}" ] && MISSING="$MISSING TF_VAR_kiro_guardrail_scp_id"
[ -z "${TF_VAR_freeze_scp_id:-}" ] && MISSING="$MISSING TF_VAR_freeze_scp_id"
if [ -n "$MISSING" ]; then
  echo "ERROR: missing required input(s) from foundation/:$MISSING" >&2
  echo "These come from the foundation stack. Run 'mise run foundation-apply' and" >&2
  echo "export the three TF_VAR_* it prints before running governance." >&2
  exit 1
fi
require_backend_hcl "governance/terraform/backend.hcl" \
  "Run the backend bootstrap first (it writes this file):" \
  "  mise run backend-bootstrap" \
  "or copy the template by hand: cp backend.hcl.example backend.hcl"
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key
export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's governance key BEFORE plan (R6.2); fail
# closed (R6.3).
tofu_init_keyed "workshops/${WID}/governance/terraform.tfstate" "backend init failed; not planning."
tofu plan
"""

[tasks.governance-apply]
description = "Apply: create (or re-converge) a workshop's OU, guardrail SCP attachment, and per-account budgets using the shared SCPs + budgets role from foundation/ (requires WORKSHOP_ID; prompts to approve)"
dir = "governance/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# --- Shared-primitive wire-forward guard (from foundation/) --------------------
# These three come from foundation/ (OpenTofu picks TF_VAR_* up automatically).
# They have no defaults, so fail closed with a pointer to foundation-apply if any
# is missing rather than letting tofu prompt for them.
MISSING=""
[ -z "${TF_VAR_budgets_execution_role_arn:-}" ] && MISSING="$MISSING TF_VAR_budgets_execution_role_arn"
[ -z "${TF_VAR_kiro_guardrail_scp_id:-}" ] && MISSING="$MISSING TF_VAR_kiro_guardrail_scp_id"
[ -z "${TF_VAR_freeze_scp_id:-}" ] && MISSING="$MISSING TF_VAR_freeze_scp_id"
if [ -n "$MISSING" ]; then
  echo "ERROR: missing required input(s) from foundation/:$MISSING" >&2
  echo "These come from the foundation stack. Run 'mise run foundation-apply' and" >&2
  echo "export the three TF_VAR_* it prints before running governance." >&2
  exit 1
fi
require_backend_hcl "governance/terraform/backend.hcl" \
  "(see governance-plan)"
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key
export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's governance key BEFORE apply (R6.2); fail
# closed (R6.3).
tofu_init_keyed "workshops/${WID}/governance/terraform.tfstate" "backend init failed; not applying."
tofu apply
# Only reached after a clean apply (set -eu). Surface the governance-OWNED
# outputs (the shared SCP ids / budgets role ARN are inputs from foundation/,
# not outputs of this stack).
echo ""
echo "Governance stack applied for workshop '$WID':"
echo "  workshop OU id:      $(tofu output -raw workshop_ou_id)"
echo "  per-account budgets (account id -> budget name / freeze action id):"
# `tofu output -json` is self-contained (no external parser); print the map
# verbatim so an operator sees every account's budget + freeze-action id. Avoids
# shelling out to python just to count keys.
tofu output -json per_account_budgets
"""

[tasks.governance-place-accounts]
description = "Move the stack's account_ids (from terraform.tfvars) into this workshop's OU via `aws organizations move-account` (requires WORKSHOP_ID; optional ACCOUNT_IDS override; real Organizations mutation; idempotent)"
dir = "governance/terraform"
run = """
set -eu
# Out-of-band account placement. The governance stack owns ONLY the OU; this
# task moves the pre-existing, in-org accounts into it with `aws organizations
# move-account`. It never creates, invites, or closes an account. It runs only
# `tofu output` (to read workshop_ou_id AND the account_ids list) — NOT
# `tofu apply` — so it does NOT need the three foundation TF_VAR_* wire-forwards,
# but it does need a successful `tofu init` to read those outputs. The account
# ids come from the stack's own state (terraform.tfvars is the single source of
# truth); set ACCOUNT_IDS only to override with a deliberate subset.
. ../../scripts/mise-tasks.sh

# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
require_backend_hcl "governance/terraform/backend.hcl" \
  "(see governance-plan)"
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key

# Reconfigure to THIS workshop's governance key BEFORE reading outputs (R6.2);
# fail closed (R6.3). Needed so `tofu output` reads this workshop's state.
tofu_init_keyed "workshops/${WID}/governance/terraform.tfstate" "backend init failed; not moving accounts."

# Read the destination OU id from the stack output. Fail closed if unreadable
# (e.g. governance-apply has not run yet for this workshop).
OU_ID="$(tofu output -raw workshop_ou_id 2>/dev/null)" || true
if [ -z "${OU_ID:-}" ]; then
  echo "ERROR: could not read workshop_ou_id from the governance state." >&2
  echo "Run 'mise run governance-apply' for WORKSHOP_ID='$WID' first." >&2
  exit 1
fi

# --- Account ids: single source of truth is the stack's own state --------------
# Read account_ids from `tofu output` so terraform.tfvars is the ONE place the
# list is declared — no parallel env var to drift out of sync. An optional
# ACCOUNT_IDS env override is honored for moving a deliberate subset; when it is
# unset (the normal case) the authoritative tfvars-derived list is used.
if [ -n "${ACCOUNT_IDS:-}" ]; then
  ACCT_IDS="$(printf '%s' "$ACCOUNT_IDS" | tr -s '[:space:],' '  ' | sed -E 's/^ | $//g')"
  echo "Using ACCOUNT_IDS override from the environment."
else
  # `tofu output -json` is self-contained; map the JSON string array to a
  # space-separated list without needing jq (tr/grep only).
  ACCT_IDS="$(tofu output -json account_ids 2>/dev/null \
    | tr -d '[]" ' | tr ',' ' ' | sed -E 's/^ | $//g')"
fi
if [ -z "$ACCT_IDS" ]; then
  echo "ERROR: no account ids to place." >&2
  echo "Set account_ids in governance/terraform/terraform.tfvars and run" >&2
  echo "'mise run governance-apply' first, or pass ACCOUNT_IDS=\\"<id> <id>\\" to override." >&2
  exit 1
fi

echo "About to MOVE existing accounts into OU $OU_ID (workshop '$WID')."
echo "This is a real AWS Organizations mutation. Accounts: $ACCT_IDS"

for ID in $ACCT_IDS; do
  # Current parent of the account (root or an OU). move-account needs the source.
  SRC="$(aws organizations list-parents --child-id "$ID" \
    --query 'Parents[0].Id' --output text)"
  if [ -z "$SRC" ] || [ "$SRC" = "None" ]; then
    echo "ERROR: could not determine current parent of account $ID; skipping is unsafe, aborting." >&2
    exit 1
  fi
  if [ "$SRC" = "$OU_ID" ]; then
    echo "  $ID already in $OU_ID — skipping (idempotent)."
    continue
  fi
  echo "  moving $ID: $SRC -> $OU_ID"
  aws organizations move-account \
    --account-id "$ID" \
    --source-parent-id "$SRC" \
    --destination-parent-id "$OU_ID"
done
echo "Done. All of the stack's account_ids are now under OU $OU_ID."
"""

[tasks.governance-move-accounts-out]
description = "PREREQUISITE for governance-destroy: move the stack's account_ids out of the workshop OU (back to parent_id) so the empty OU can be destroyed. The mirror of governance-place-accounts; a real Organizations move only — no account is created, closed, or TF-managed. Requires WORKSHOP_ID; optional ACCOUNT_IDS override; prompts to confirm."
dir = "governance/terraform"
run = """
set -eu
# Out-of-band teardown prerequisite — the exact mirror of
# `governance-place-accounts`. The governance stack owns ONLY the OU (accounts
# are placed OUTSIDE Terraform), so there is nothing in state to remove and no
# prevent_destroy guard to clear. AWS Organizations simply refuses to delete a
# non-empty OU, so before `governance-destroy` can remove it this task moves the
# stack's account_ids back OUT of the workshop OU to its parent (var.parent_id)
# with `aws organizations move-account`. It never creates, invites, or closes an
# account, and it touches NO Terraform state. It runs only `tofu output` (to
# read workshop_ou_id, parent_id, and account_ids) — NOT `tofu apply` — so it
# does not need the foundation TF_VAR_* wire-forwards, but it does need a
# successful `tofu init`. Run this, then `governance-destroy`.
. ../../scripts/mise-tasks.sh

# --- Confirmation guard --------------------------------------------------------
# This mutates the LIVE Organizations management account (it moves member
# accounts between OUs). Require an explicit typed phrase before anything runs.
printf 'This MOVES the stack'"'"'s member accounts out of the workshop OU in the\\n'
printf 'LIVE Organizations management account (back to parent_id).\\n'
require_typed_phrase "move-accounts-out" "moving nothing."

# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
require_backend_hcl "governance/terraform/backend.hcl" \
  "(see governance-plan)"
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key
# Reconfigure to THIS workshop's governance key BEFORE reading outputs (R6.2);
# fail closed (R6.3). Needed so `tofu output` reads this workshop's state.
tofu_init_keyed "workshops/${WID}/governance/terraform.tfstate" "backend init failed; not moving accounts."

# Source OU (where the accounts currently live) and destination parent
# (var.parent_id — where the OU hangs under, and where the accounts return to).
OU_ID="$(tofu output -raw workshop_ou_id 2>/dev/null)" || true
if [ -z "${OU_ID:-}" ]; then
  echo "ERROR: could not read workshop_ou_id from the governance state." >&2
  echo "Run 'mise run governance-apply' for WORKSHOP_ID='$WID' first." >&2
  exit 1
fi
# parent_id is an INPUT, not an output; read it from the applied variable via a
# plan-free `tofu console` so the destination is authoritative, not re-typed.
DEST_PARENT="$(printf 'var.parent_id\\n' | tofu console 2>/dev/null | tr -d '\"[:space:]')"
if [ -z "$DEST_PARENT" ]; then
  echo "ERROR: could not resolve parent_id (destination) from the stack vars." >&2
  exit 1
fi

# --- Account ids: single source of truth is the stack's own state --------------
# Read account_ids from `tofu output` so terraform.tfvars is the ONE place the
# list is declared — identical to governance-place-accounts. An optional
# ACCOUNT_IDS env override is honored for moving a deliberate subset.
if [ -n "${ACCOUNT_IDS:-}" ]; then
  ACCT_IDS="$(printf '%s' "$ACCOUNT_IDS" | tr -s '[:space:],' '  ' | sed -E 's/^ | $//g')"
  echo "Using ACCOUNT_IDS override from the environment."
else
  ACCT_IDS="$(tofu output -json account_ids 2>/dev/null \
    | tr -d '[]" ' | tr ',' ' ' | sed -E 's/^ | $//g')"
fi
if [ -z "$ACCT_IDS" ]; then
  echo "ERROR: no account ids to move out." >&2
  echo "Set account_ids in governance/terraform/terraform.tfvars (and run" >&2
  echo "'mise run governance-apply' first), or pass ACCOUNT_IDS=\\"<id> <id>\\" to override." >&2
  exit 1
fi
echo "Moving accounts OUT of OU $OU_ID -> parent $DEST_PARENT (workshop '$WID')."
echo "This is a real AWS Organizations mutation. Accounts: $ACCT_IDS"
for ID in $ACCT_IDS; do
  # Current parent of the account is the move source (robust if already moved).
  SRC="$(aws organizations list-parents --child-id "$ID" \
    --query 'Parents[0].Id' --output text)"
  if [ -z "$SRC" ] || [ "$SRC" = "None" ]; then
    echo "ERROR: could not determine current parent of account $ID; aborting." >&2
    exit 1
  fi
  if [ "$SRC" = "$DEST_PARENT" ]; then
    echo "  $ID already under $DEST_PARENT — skipping (idempotent)."
    continue
  fi
  echo "  moving $ID: $SRC -> $DEST_PARENT"
  aws organizations move-account \
    --account-id "$ID" \
    --source-parent-id "$SRC" \
    --destination-parent-id "$DEST_PARENT"
done
echo ""
echo "Done. The workshop OU is empty; you can now run: mise run governance-destroy"
"""

[tasks.governance-destroy]
description = "DESTRUCTIVE: delete a workshop's OU, guardrail attachment, and budgets. Run governance-move-accounts-out FIRST (AWS refuses to delete a non-empty OU). Requires typing 'destroy-governance'; then prompts tofu's own approval."
dir = "governance/terraform"
run = """
set -eu
. ../../scripts/mise-tasks.sh
# --- Typed-phrase guard (R12.3, R12.4) -----------------------------------------
# This mutates the LIVE Organizations management account; deleting it is
# deliberate. Require the operator to type the fixed phrase before anything
# proceeds. A mismatch exits non-zero and deletes nothing; a match proceeds to
# tofu's OWN destroy approval prompt (a second, independent gate).
printf 'This mutates the LIVE Organizations management account (OU + SCPs + budgets).\\n'
require_typed_phrase "destroy-governance" "destroying nothing."

# WORKSHOP_ID guard (R6.1, R6.7, R8.4): sets WID; fails closed if unset/invalid.
require_workshop_id
# --- Shared-primitive wire-forward guard (from foundation/) --------------------
# destroy also instantiates the provider/vars, so the three no-default inputs
# must be present (OpenTofu picks TF_VAR_* up automatically). Fail closed with a
# pointer to foundation-apply if any is missing.
MISSING=""
[ -z "${TF_VAR_budgets_execution_role_arn:-}" ] && MISSING="$MISSING TF_VAR_budgets_execution_role_arn"
[ -z "${TF_VAR_kiro_guardrail_scp_id:-}" ] && MISSING="$MISSING TF_VAR_kiro_guardrail_scp_id"
[ -z "${TF_VAR_freeze_scp_id:-}" ] && MISSING="$MISSING TF_VAR_freeze_scp_id"
if [ -n "$MISSING" ]; then
  echo "ERROR: missing required input(s) from foundation/:$MISSING" >&2
  echo "These come from the foundation stack. Run 'mise run foundation-apply' and" >&2
  echo "export the three TF_VAR_* it prints before running governance." >&2
  exit 1
fi
require_backend_hcl "governance/terraform/backend.hcl" \
  "(see governance-plan)"
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
reject_residual_key
export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's governance key BEFORE destroy (R6.2); fail
# closed (R6.3).
tofu_init_keyed "workshops/${WID}/governance/terraform.tfstate" "backend init failed; not destroying."
# tofu destroy still prompts for its own approval before deleting (R12.5).
tofu destroy
"""
