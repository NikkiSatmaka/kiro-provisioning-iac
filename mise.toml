# mise config scoped to this project.
# Loaded automatically when you cd into this directory (requires `mise activate`
# in your shell rc, or use `mise exec` / `mise run`).
#
# Quick start:
#   mise install        # install all tools below + create the Python venv
#   mise run setup      # sync Python deps into .venv via uv
#   mise run verify     # confirm AWS auth with the project profile

[tools]
python = "3.12"
opentofu = "1.13"
aws-cli = "latest"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

# All per-run / per-account values live in a single git-ignored `.env` file at
# the repo root. Copy the template and edit it — nothing else here needs touching:
#   cp .env.example .env   # then set AWS_PROFILE / AWS_REGION / ...
# mise sources `.env` first; the AWS_* lines below only supply fallbacks via
# `default`, so whatever `.env` (or your shell) sets wins. A missing `.env` is
# fine — the defaults apply.
_.file = ".env"

# Point the AWS CLI/SDKs at project-local config so the profile is scoped here
# and your global ~/.aws is left untouched.
AWS_CONFIG_FILE = "{{config_root}}/.aws/config"
AWS_SHARED_CREDENTIALS_FILE = "{{config_root}}/.aws/credentials"

# Fallbacks only. `.env` (or the shell) overrides these; `default` keeps any
# existing non-empty value and applies the fallback only when unset.
AWS_PROFILE = { default = "kiro-provisioning" }
AWS_REGION = { default = "us-east-1" }
# Mirror AWS_REGION so the two never diverge, whatever .env/shell set it to.
AWS_DEFAULT_REGION = "{{ env.AWS_REGION }}"

# =============================================================================
# === shared / toolchain ===
# =============================================================================

[tasks.setup]
description = "Install locked Python dependencies into .venv"
run = "uv sync"

[tasks.lock]
description = "Resolve and update uv.lock from pyproject.toml"
run = "uv lock"

# --- First-run bootstrap -----------------------------------------------------
# Bridges the gap between the quick start and RUNBOOK.md. The `cp` of the
# example config files is a manual step (see README quick start); only the
# AWS profile generation is wrapped here, since it runs `aws configure`.

[tasks.aws-configure]
description = "Create/update the project-local AWS profile via `aws configure` (writes to .aws/, not ~/.aws)"
run = """
set -eu
echo "Configuring AWS profile '$AWS_PROFILE' into project-local .aws/ (region: $AWS_REGION)."
echo "Have your access key id + secret access key ready (from creds/)."
aws configure --profile "$AWS_PROFILE"
"""

[tasks.verify]
description = "Verify AWS auth with the project profile"
run = "aws sts get-caller-identity"

# =============================================================================
# === backend/ stack ===
# =============================================================================
# Remote state backend (one-time, run BEFORE the subscription stack).
# Remote S3 state is REQUIRED. `tofu destroy` only deletes what is in its state,
# and local state is git-ignored, so teardown from a fresh clone a month later
# would orphan everything. These tasks create the S3 bucket + DynamoDB lock
# table (the backend/ stack keeps its OWN local state — chicken-and-egg) and
# then WRITE subscription/terraform/backend.hcl for you from the bootstrap
# output — the bucket name is derived from your account id, so there is nothing
# to fill in. subscription/terraform/backend.tf is tracked + value-free, so no
# activation copy is needed; see subscription/RUNBOOK.md step 1b. provision.py
# fails closed until backend.hcl exists. Prefer manual control?
# `cp subscription/terraform/backend.hcl.example subscription/terraform/backend.hcl`
# and edit it instead — the escape hatch backend.hcl.example exists for that.

[tasks.backend-bootstrap-plan]
description = "DRY RUN: tofu init + plan for the S3 state bucket + lock table (creates nothing)"
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu plan
"""

[tasks.backend-bootstrap]
description = "One-time (REQUIRED): create the S3 state bucket + lock table AND write the subscription/ and claim-service/ backend.hcl files (prompts to approve)."
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu apply
# Only reached after a clean apply (set -eu). The bootstrap dir is
# backend/terraform, so ../../<stack>/terraform/backend.hcl is where each
# stack's `tofu init -backend-config=backend.hcl` reads it. Both stacks share
# the one bucket + lock table and differ only by state key, so write both from
# the matching outputs. `-raw` emits the heredoc body without surrounding quotes.
tofu output -raw backend_hcl > ../../subscription/terraform/backend.hcl
echo "wrote subscription/terraform/backend.hcl"
cat ../../subscription/terraform/backend.hcl
tofu output -raw backend_hcl_claim_service > ../../claim-service/terraform/backend.hcl
echo "wrote claim-service/terraform/backend.hcl"
cat ../../claim-service/terraform/backend.hcl
"""

[tasks.backend-destroy]
description = "Delete the S3 state bucket + lock table (empties versioned state automatically; prompts to confirm)"
dir = "backend/terraform"
run = """
set -eu
# Apply force_destroy=true to the bucket FIRST so the provider is allowed to
# empty a versioned bucket on destroy; then destroy. Passing -var inline means
# no terraform.tfvars edit is needed — this stays a single, repeatable step for
# every future project. Both steps prompt before mutating.
tofu apply -var force_destroy=true
tofu destroy -var force_destroy=true
"""

# =============================================================================
# === subscription/ stack ===
# =============================================================================
# Provisioning entrypoints — see subscription/RUNBOOK.md. These drive only the
# AUTOMATABLE steps; the entrypoint prints the console-only steps (MFA optional,
# enable Kiro, assign tier, one-time passwords) as a checklist. Nothing mutates
# the account by default:
#   - provision-plan is a safe DRY RUN (tofu init + plan, reports only).
#   - provision applies (tofu apply) and still prompts for approval.
# Run them yourself when ready; they are not automatic.

[tasks.provision-plan]
description = "DRY RUN: tofu init + plan for the IdC provisioning (no changes)"
dir = "subscription/scripts"
run = "python provision.py"

[tasks.provision]
description = "Apply: create IdC instance + users + groups + memberships, then render credentials (prompts to approve)"
dir = "subscription/scripts"
run = "python provision.py --apply"

[tasks.provision-render]
description = "Re-render output/credentials.md from an existing manifest (pass --otp-csv as needed)"
dir = "subscription/scripts"
run = "python provision.py --render-only"

# Render output/credentials.md after you have filled in output/otps.csv with the
# one-time passwords collected from the console (header: username,otp). The
# sign-in URL always comes from the manifest (derived from the identity store id
# by `tofu output`), so there is nothing to paste by hand.
[tasks.credentials]
description = "Render output/credentials.md from output/otps.csv (sign-in URL comes from the manifest)"
dir = "subscription/scripts"
run = """
set -eu
if [ ! -f ../output/otps.csv ]; then
  echo "ERROR: ../output/otps.csv not found." >&2
  echo "Collect one-time passwords from the console (RUNBOOK.md step 5) into a" >&2
  echo "CSV with the header 'username,otp', e.g.:" >&2
  echo "" >&2
  echo "  username,otp" >&2
  echo "  kiro-user-01,Ab12..." >&2
  echo "" >&2
  echo "then re-run: mise run credentials" >&2
  exit 1
fi
python provision.py --render-only --otp-csv ../output/otps.csv
"""

# Teardown entrypoints — see subscription/TEARDOWN.md. Nothing here mutates the
# account by default:
#   - teardown-plan is a safe DRY RUN (Option A discovery, reports only).
#   - teardown-tofu runs `tofu destroy` (Option B) and still prompts for yes.
# Run them yourself when you are ready to clean up; they are not automatic.

[tasks.teardown-plan]
description = "DRY RUN: discover what teardown would delete (Option A, no changes)"
dir = "subscription/scripts"
run = "python teardown.py"

[tasks.teardown-run]
description = "Option A fallback: delete IdC users/groups/memberships + instance (prompts to confirm)"
dir = "subscription/scripts"
run = "python teardown.py --delete --delete-instance"

[tasks.teardown-tofu]
description = "Option B primary: tofu destroy (needs remote state or local state; prompts to confirm)"
dir = "subscription/terraform"
run = "tofu destroy"

# =============================================================================
# === claim-service/ stack ===
# =============================================================================
# Self-serve credential claim service — see claim-service/README.md. Tasks are
# ordered to match the operator lifecycle:
#
#   test  ->  deploy-plan  ->  deploy  ->  seed-plan  ->  seed
#         ->  (workshop runs)  ->  audit  ->  destroy
#
# Conventions mirror the subscription/ stack: every mutating step has a safe
# *-plan / dry-run sibling that reports without changing anything, and the
# apply/seed/destroy steps prompt before they mutate. Nothing here runs
# automatically.
#
# Secrets: the Function URL is public (authorization NONE); access is gated in
# the handler by WORKSHOP_CODE + the per-IP cap. Set WORKSHOP_CODE in the
# git-ignored .env (see .env.example). OpenTofu reads it via TF_VAR_workshop_code,
# which these tasks export from WORKSHOP_CODE so the sensitive var is never
# written to a tracked file or passed on the command line.

# --- 1. Test (local, no AWS) -------------------------------------------------
[tasks.claim-test]
description = "Run the claim-service test suite (pytest + Hypothesis + moto; no AWS needed)"
dir = "claim-service"
run = "uv run --group dev pytest -q"

# --- 2. Deploy ---------------------------------------------------------------
# backend.hcl must exist first (reuses the shared state bucket from backend/):
#   cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl
#   # then set your 12-digit <account_id> in the bucket name
# See claim-service/README.md "Deploy". WORKSHOP_CODE must be set in .env.

[tasks.claim-deploy-plan]
description = "DRY RUN: tofu init + plan for the claim service (creates nothing)"
dir = "claim-service/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: claim-service/terraform/backend.hcl not found." >&2
  echo "Create it from the template (reuses the shared state bucket):" >&2
  echo "  cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl" >&2
  echo "then set your 12-digit <account_id> in the bucket name and re-run." >&2
  exit 1
fi
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_CODE=my-workshop-2026" >&2
  exit 1
fi
export TF_VAR_workshop_code="$WORKSHOP_CODE"
tofu init -input=false -backend-config=backend.hcl
tofu plan
"""

[tasks.claim-deploy]
description = "Apply: create the DynamoDB table, Lambda, and Function URL, then print the claim URL (prompts to approve)"
dir = "claim-service/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: claim-service/terraform/backend.hcl not found (see claim-deploy-plan)." >&2
  exit 1
fi
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set (see .env.example)." >&2
  exit 1
fi
export TF_VAR_workshop_code="$WORKSHOP_CODE"
tofu init -input=false -backend-config=backend.hcl
tofu apply
# Only reached after a clean apply (set -eu). Print the public HTTPS URL
# participants hit — put it behind the workshop QR code / short link.
echo ""
echo "Claim service deployed. Participant URL (HTTPS):"
tofu output -raw claim_url
echo ""
"""

[tasks.claim-url]
description = "Print the deployed claim URL (the HTTPS Function URL for the QR code / short link)"
dir = "claim-service/terraform"
run = "tofu output -raw claim_url"

# --- 3. Seed the pool --------------------------------------------------------
# Reads the subscription/ outputs (otps.csv + manifest.json) and writes one
# CRED# item per credential. --apply is required to write; without it the
# script is a dry run. The table name defaults to the stack's var.table_name.

[tasks.claim-seed-plan]
description = "DRY RUN: classify otps.csv rows and report what would be seeded (writes nothing)"
dir = "claim-service/scripts"
run = """
set -eu
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --table credential-claim-service
"""

[tasks.claim-seed]
description = "Seed the claim pool from the subscription/ outputs (writes CRED# items; conditional, safe to re-run)"
dir = "claim-service/scripts"
run = """
set -eu
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --table credential-claim-service \
  --apply
"""

# --- 4. Audit (after the workshop, before teardown) --------------------------
[tasks.claim-audit]
description = "Export who claimed what to a git-ignored CSV under claim-service/output/ (PII — not committed)"
dir = "claim-service/scripts"
run = """
set -eu
TABLE_NAME=credential-claim-service python export_audit.py
"""

# --- 5. Destroy --------------------------------------------------------------
[tasks.claim-destroy]
description = "Tear down the claim service (table, Lambda, Function URL); never touches subscription/ identities (prompts to confirm)"
dir = "claim-service/terraform"
run = """
set -eu
# workshop_code is required by the stack even to destroy (it is a required var);
# export it from the env so destroy does not prompt for a value.
export TF_VAR_workshop_code="${WORKSHOP_CODE:-unused-at-destroy}"
tofu destroy
"""
