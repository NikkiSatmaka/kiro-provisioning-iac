[project]
name = "workshop-kiro-aop-oct"
version = "0.1.0"
description = "Tooling environment for the Kiro AOP workshop (AWS MCP + IaC auth setup)."
readme = "workshop/README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # AWS MCP proxy server used by Kiro (.kiro/settings/mcp.json runs this via uvx).
    # Pinned here so the project venv has a reproducible copy for local runs/testing.
    "mcp-proxy-for-aws>=1.7.0,<2",
    # AWS SDK for Python, handy for ad-hoc scripting against the workshop account.
    "boto3>=1.35",
]

[dependency-groups]
# Dev-only tooling. Installed by `uv sync` (default) but excluded from the
# published project dependencies. Install prod-only deps with `uv sync --no-dev`.
dev = [
    "ruff>=0.6",
]

[tool.uv]
# Keep the environment reproducible via uv.lock (generated by `mise run lock`).
package = false
