[project]
name = "claim-service"
version = "0.1.0"
description = "Credential Claim Service: Lambda handler, tests, and operator scripts."
requires-python = ">=3.14,<3.15"
dependencies = [
    # AWS SDK, used by the Lambda handler and the operator scripts.
    "boto3>=1.44.2",
]

[dependency-groups]
# Test tooling, scoped to this subtree so the root project stays lean.
dev = ["pytest>=9.2.0", "hypothesis>=6.170.15", "moto[dynamodb]>=5.2.5"]

[tool.uv]
package = false
