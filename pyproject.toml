[project]
name = "kiro-provisioning-iac"
version = "0.1.0"
description = "Reusable IaC + Python tooling to provision Kiro enterprise subscriptions via IAM Identity Center."
readme = "subscription/README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # AWS SDK for Python, used by the provisioning/teardown scripts in subscription/scripts.
    "boto3>=1.35",
]

[dependency-groups]
# Dev-only tooling. Installed by `uv sync` (default) but excluded from the
# published project dependencies. Install prod-only deps with `uv sync --no-dev`.
dev = ["ruff>=0.6"]
# Test tooling for the claim-service test suite: pytest runs the suite and
# hypothesis drives the property-based tests (design: Testing Strategy).
test = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.uv]
# Keep the environment reproducible via uv.lock (generated by `mise run lock`).
package = false

[tool.pytest.ini_options]
# Scope collection to the root-level `tests/` suite. The `claim-service/`
# subtree is a self-contained project with its OWN pytest.ini and venv (it
# needs `moto`, which lives only in that project's dev group), so a bare
# `pytest` from the repo root must NOT descend into it — otherwise collection
# fails with ModuleNotFoundError. Run the claim-service suite from its own
# directory (`mise run claim-test`).
testpaths = ["tests"]
# Extend pytest's default ignores (".*", "build", "dist", "CVS", "_darcs",
# "{arch}", "*.egg", "venv") rather than replace them — keep "*" / ".*" so
# dot-dirs like .hypothesis and .venv stay ignored — and add the claim-service
# subtree.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "claim-service",
]
