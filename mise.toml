# mise config scoped to this project.
# Loaded automatically when you cd into this directory (requires `mise activate`
# in your shell rc, or use `mise exec` / `mise run`).
#
# Quick start:
#   mise install        # install all tools below + create the Python venv
#   mise run setup      # sync Python deps into .venv via uv
#   mise run verify     # confirm AWS auth with the project profile

[tools]
python = "3.12"
opentofu = "1.13"
aws-cli = "latest"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

# All per-run / per-account values live in a single git-ignored `.env` file at
# the repo root. Copy the template and edit it — nothing else here needs touching:
#   cp .env.example .env   # then set AWS_PROFILE / AWS_REGION / ...
# mise sources `.env` first; the AWS_* lines below only supply fallbacks via
# `default`, so whatever `.env` (or your shell) sets wins. A missing `.env` is
# fine — the defaults apply.
_.file = ".env"

# Point the AWS CLI/SDKs at project-local config so the profile is scoped here
# and your global ~/.aws is left untouched.
AWS_CONFIG_FILE = "{{config_root}}/.aws/config"
AWS_SHARED_CREDENTIALS_FILE = "{{config_root}}/.aws/credentials"

# Fallbacks only. `.env` (or the shell) overrides these; `default` keeps any
# existing non-empty value and applies the fallback only when unset.
AWS_PROFILE = { default = "kiro-provisioning" }

# Region split: KIRO_REGION is the sign-in region (Kiro-only), IDC_REGION is
# where all AWS resources are provisioned.
# Kiro sign-in region (Kiro-only). Default is Kiro's single supported region.
KIRO_REGION = { default = "us-east-1" }
# Resource-provisioning region. Default is the operator's target region.
IDC_REGION = { default = "ap-southeast-1" }
# AWS_REGION tracks IDC_REGION so every AWS CLI/SDK/OpenTofu call targets the
# provisioning region. `.env` (or the shell) may still override IDC_REGION.
AWS_REGION = "{{ env.IDC_REGION }}"
# Mirror AWS_REGION so the two never diverge, whatever .env/shell set it to.
AWS_DEFAULT_REGION = "{{ env.AWS_REGION }}"

# =============================================================================
# === shared / toolchain ===
# =============================================================================

[tasks.setup]
description = "Install locked Python dependencies into .venv"
run = "uv sync"

[tasks.lock]
description = "Resolve and update uv.lock from pyproject.toml"
run = "uv lock"

# --- First-run bootstrap -----------------------------------------------------
# Bridges the gap between the quick start and RUNBOOK.md. The `cp` of the
# example config files is a manual step (see README quick start); only the
# AWS profile generation is wrapped here, since it runs `aws configure`.

[tasks.aws-configure]
description = "Create/update the project-local AWS profile via `aws configure` (writes to .aws/, not ~/.aws)"
run = """
set -eu
echo "Configuring AWS profile '$AWS_PROFILE' into project-local .aws/ (region: $AWS_REGION)."
echo "Have your access key id + secret access key ready (from creds/)."
aws configure --profile "$AWS_PROFILE"
"""

[tasks.verify]
description = "Verify AWS auth with the project profile"
run = "aws sts get-caller-identity"

# =============================================================================
# === backend/ stack ===
# =============================================================================
# Remote state backend (one-time, run BEFORE the subscription stack).
# Remote S3 state is REQUIRED. `tofu destroy` only deletes what is in its state,
# and local state is git-ignored, so teardown from a fresh clone a month later
# would orphan everything. These tasks create the S3 bucket + DynamoDB lock
# table (the backend/ stack keeps its OWN local state — chicken-and-egg) and
# then WRITE subscription/terraform/backend.hcl for you from the bootstrap
# output — the bucket name is derived from your account id, so there is nothing
# to fill in. subscription/terraform/backend.tf is tracked + value-free, so no
# activation copy is needed; see subscription/RUNBOOK.md step 1b. provision.py
# fails closed until backend.hcl exists. Prefer manual control?
# `cp subscription/terraform/backend.hcl.example subscription/terraform/backend.hcl`
# and edit it instead — the escape hatch backend.hcl.example exists for that.

[tasks.backend-bootstrap-plan]
description = "DRY RUN: tofu init + plan for the S3 state bucket + lock table (creates nothing)"
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu plan
"""

[tasks.backend-bootstrap]
description = "One-time (REQUIRED): create the S3 state bucket + lock table AND write the subscription/, claim-service/, foundation/, and governance/ backend.hcl files (prompts to approve)."
dir = "backend/terraform"
run = """
set -eu
tofu init -input=false
tofu apply
# Only reached after a clean apply (set -eu). The bootstrap dir is
# backend/terraform, so ../../<stack>/terraform/backend.hcl is where each
# stack's `tofu init -backend-config=backend.hcl` reads it. Both stacks share
# the one bucket + lock table and differ only by state key, so write both from
# the matching outputs. `-raw` emits the heredoc body without surrounding quotes.
tofu output -raw backend_hcl > ../../subscription/terraform/backend.hcl
echo "wrote subscription/terraform/backend.hcl"
cat ../../subscription/terraform/backend.hcl
tofu output -raw backend_hcl_claim_service > ../../claim-service/terraform/backend.hcl
echo "wrote claim-service/terraform/backend.hcl"
cat ../../claim-service/terraform/backend.hcl
tofu output -raw backend_hcl_foundation > ../../foundation/terraform/backend.hcl
echo "wrote foundation/terraform/backend.hcl"
cat ../../foundation/terraform/backend.hcl
tofu output -raw backend_hcl_governance > ../../governance/terraform/backend.hcl
echo "wrote governance/terraform/backend.hcl"
cat ../../governance/terraform/backend.hcl
"""

[tasks.backend-destroy]
description = "Delete the S3 state bucket + lock table (empties versioned state automatically; prompts to confirm)"
dir = "backend/terraform"
run = """
set -eu
# Apply force_destroy=true to the bucket FIRST so the provider is allowed to
# empty a versioned bucket on destroy; then destroy. Passing -var inline means
# no terraform.tfvars edit is needed — this stays a single, repeatable step for
# every future project. Both steps prompt before mutating.
tofu apply -var force_destroy=true
tofu destroy -var force_destroy=true
"""

# =============================================================================
# === subscription/ stack ===
# =============================================================================
# Provisioning entrypoints — see subscription/RUNBOOK.md. These drive only the
# AUTOMATABLE steps; the entrypoint prints the console-only steps (MFA optional,
# enable Kiro, assign tier, one-time passwords) as a checklist. Nothing mutates
# the account by default:
#   - provision-plan is a safe DRY RUN (tofu init + plan, reports only).
#   - provision applies (tofu apply) and still prompts for approval.
# Run them yourself when ready; they are not automatic.

[tasks.provision-plan]
description = "DRY RUN: tofu init + plan for the IdC provisioning (no changes)"
dir = "subscription/scripts"
run = """
set -eu
# Pass the Kiro sign-in region to Terraform via TF_VAR_kiro_region (mirrors how
# claim-deploy exports TF_VAR_workshop_code). AWS_REGION (= IDC_REGION) still
# drives the provider; this only feeds the kiro_region manifest field.
export TF_VAR_kiro_region="$KIRO_REGION"
python provision.py
"""

[tasks.provision]
description = "Apply: create a workshop's IdC users + groups + memberships + assignments, then render credentials (requires WORKSHOP_ID; prompts to approve)"
dir = "subscription/terraform"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
# Whitespace-only WORKSHOP_ID is treated as unset: strip all whitespace, then
# fail closed (non-zero exit, no action) if what remains is empty.
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
# Slug-guard: 1-63 lowercase alphanumeric + hyphens, begin/end alphanumeric,
# no consecutive hyphens (R5.8, R8.3). Defense-in-depth; the TF variable
# validation is the authoritative gate.
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
if [ -f backend.hcl ] && grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi

SUB_KEY="workshops/${WID}/subscription/terraform.tfstate"
# Collision warning (not a hard stop): the subscription state key already exists
# for this workshop (R8.5). Re-provisioning an existing workshop is legitimate.
BUCKET="$(grep -E '^[[:space:]]*bucket' backend.hcl | sed -E 's/.*= *"(.*)".*/\\1/')"
if [ -n "$BUCKET" ] && aws s3api head-object --bucket "$BUCKET" --key "$SUB_KEY" >/dev/null 2>&1; then
  echo "WARNING: subscription state key already exists -> $SUB_KEY" >&2
  echo "WARNING: workshop '$WID' may already be provisioned; proceeding." >&2
fi

# Thread the workshop namespace to OpenTofu (R6.4, R8.2). Pass the Kiro sign-in
# region via TF_VAR_kiro_region too (AWS_REGION = IDC_REGION still drives the
# provider; this only feeds the kiro_region manifest field).
export TF_VAR_workshop_id="$WID"
export TF_VAR_kiro_region="$KIRO_REGION"

# Reconfigure the backend to THIS workshop's key BEFORE apply (R6.2) and fail
# closed if init exits non-zero (R6.3) — set -eu already propagates the failure.
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=${SUB_KEY}" \
  || { echo "ERROR: backend reconfiguration failed; not applying." >&2; exit 1; }
tofu apply

# Only reached after a clean apply (set -eu). Export the manifest and render
# credentials.md — the behavior provision.py drives after an apply. Run both
# directly here so the single reconfigured backend init above is authoritative
# (a second un-reconfigured `tofu init` from provision.py would clobber the
# workshop-keyed backend pointer).
mkdir -p ../output
tofu output -json provisioning_manifest > ../output/manifest.json
echo "wrote ../output/manifest.json"
( cd ../scripts && python provision.py --render-only )
"""

[tasks.provision-render]
description = "Re-render output/credentials.md from an existing manifest (pass --otp-csv as needed)"
dir = "subscription/scripts"
run = "python provision.py --render-only"

# Render output/credentials.md after you have filled in output/otps.csv with the
# one-time passwords collected from the console (header: username,otp). The
# sign-in URL always comes from the manifest (derived from the identity store id
# by `tofu output`), so there is nothing to paste by hand.
[tasks.credentials]
description = "Render output/credentials.md from output/otps.csv (sign-in URL comes from the manifest)"
dir = "subscription/scripts"
run = """
set -eu
if [ ! -f ../output/otps.csv ]; then
  echo "ERROR: ../output/otps.csv not found." >&2
  echo "Collect one-time passwords from the console (RUNBOOK.md step 5) into a" >&2
  echo "CSV with the header 'username,otp', e.g.:" >&2
  echo "" >&2
  echo "  username,otp" >&2
  echo "  kiro-user-01,Ab12..." >&2
  echo "" >&2
  echo "then re-run: mise run credentials" >&2
  exit 1
fi
python provision.py --render-only --otp-csv ../output/otps.csv
"""

# Teardown entrypoints — see subscription/TEARDOWN.md. Nothing here mutates the
# account by default:
#   - teardown-plan is a safe DRY RUN (Option A discovery, reports only).
#   - teardown-tofu runs `tofu destroy` (Option B) and still prompts for yes.
# Run them yourself when you are ready to clean up; they are not automatic.

[tasks.teardown-plan]
description = "DRY RUN: discover what teardown would delete (Option A, no changes)"
dir = "subscription/scripts"
run = "python teardown.py"

[tasks.teardown-run]
description = "Option A fallback: delete this workshop's IdC users/groups/memberships (prompts to confirm; never deletes the shared org instance)"
dir = "subscription/scripts"
run = "python teardown.py --delete"

[tasks.teardown-tofu]
description = "Option B primary: tofu destroy a workshop's subscription state (requires WORKSHOP_ID; prompts to confirm)"
dir = "subscription/terraform"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
if [ -f backend.hcl ] && grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi

export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's key BEFORE destroy (R6.2); fail closed (R6.3).
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=workshops/${WID}/subscription/terraform.tfstate" \
  || { echo "ERROR: backend reconfiguration failed; not destroying." >&2; exit 1; }
tofu destroy
"""

# =============================================================================
# === claim-service/ stack ===
# =============================================================================
# Self-serve credential claim service — see claim-service/README.md. Tasks are
# ordered to match the operator lifecycle:
#
#   test  ->  deploy-plan  ->  deploy  ->  seed-plan  ->  seed
#         ->  (workshop runs)  ->  audit  ->  destroy
#
# Conventions mirror the subscription/ stack: every mutating step has a safe
# *-plan / dry-run sibling that reports without changing anything, and the
# apply/seed/destroy steps prompt before they mutate. Nothing here runs
# automatically.
#
# Secrets: the Function URL is public (authorization NONE); access is gated in
# the handler by WORKSHOP_CODE + the per-IP cap. Set WORKSHOP_CODE in the
# git-ignored .env (see .env.example). OpenTofu reads it via TF_VAR_workshop_code,
# which these tasks export from WORKSHOP_CODE so the sensitive var is never
# written to a tracked file or passed on the command line.

# --- 1. Test (local, no AWS) -------------------------------------------------
[tasks.claim-test]
description = "Run the claim-service test suite (pytest + Hypothesis + moto; no AWS needed)"
dir = "claim-service"
run = "uv run --group dev pytest -q"

# --- 2. Deploy ---------------------------------------------------------------
# backend.hcl must exist first (reuses the shared state bucket from backend/):
#   cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl
#   # then set your 12-digit <account_id> in the bucket name
# See claim-service/README.md "Deploy". WORKSHOP_CODE must be set in .env.

[tasks.claim-deploy-plan]
description = "DRY RUN: tofu init + plan for the claim service (creates nothing)"
dir = "claim-service/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: claim-service/terraform/backend.hcl not found." >&2
  echo "Create it from the template (reuses the shared state bucket):" >&2
  echo "  cp claim-service/terraform/backend.hcl.example claim-service/terraform/backend.hcl" >&2
  echo "then set your 12-digit <account_id> in the bucket name and re-run." >&2
  exit 1
fi
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_CODE=my-workshop-2026" >&2
  exit 1
fi
export TF_VAR_workshop_code="$WORKSHOP_CODE"
tofu init -input=false -backend-config=backend.hcl
tofu plan
"""

[tasks.claim-deploy]
description = "Apply: create a workshop's DynamoDB table, Lambda, and Function URL, then print the claim URL (requires WORKSHOP_ID + WORKSHOP_CODE; prompts to approve)"
dir = "claim-service/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: claim-service/terraform/backend.hcl not found (see claim-deploy-plan)." >&2
  exit 1
fi
# --- WORKSHOP_ID guard (namespace; R6.1, R6.7, R8.4) ---------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi
# --- WORKSHOP_CODE guard (access gate; distinct from the namespace, R9.5) ------
if [ -z "${WORKSHOP_CODE:-}" ]; then
  echo "ERROR: WORKSHOP_CODE is not set (see .env.example)." >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
if grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi

# Thread both values to OpenTofu as two distinct TF vars (R6.4, R8.2, R9.5).
export TF_VAR_workshop_id="$WID"
export TF_VAR_workshop_code="$WORKSHOP_CODE"
# Reconfigure to THIS workshop's claim-service key BEFORE apply (R6.2); fail
# closed (R6.3).
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=workshops/${WID}/claim-service/terraform.tfstate" \
  || { echo "ERROR: backend reconfiguration failed; not applying." >&2; exit 1; }
tofu apply
# Only reached after a clean apply (set -eu). Print the public HTTPS URL
# participants hit — put it behind the workshop QR code / short link.
echo ""
echo "Claim service deployed. Participant URL (HTTPS):"
tofu output -raw claim_url
echo ""
"""

[tasks.claim-url]
description = "Print the deployed claim URL (the HTTPS Function URL for the QR code / short link)"
dir = "claim-service/terraform"
run = "tofu output -raw claim_url"

# --- 3. Seed the pool --------------------------------------------------------
# Reads the subscription/ outputs (otps.csv + manifest.json) and reports one
# CRED# item per credential. --apply is required to write; without it (as here)
# the script is a dry run that classifies rows and writes nothing. The table
# name is derived from WORKSHOP_ID as credential-claim-<WORKSHOP_ID> — the SAME
# namespaced name the stack's local.name uses and that `claim-seed` writes to —
# so the dry-run report names the exact table a later --apply would target
# (replacing the old static `credential-claim-service` name). WORKSHOP_ID is
# required so the dry run names the real table; set it in the git-ignored .env.

[tasks.claim-seed-plan]
description = "DRY RUN: classify otps.csv rows and report what would be seeded (writes nothing)"
dir = "claim-service/scripts"
run = """
set -eu
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --workshop-id "${WORKSHOP_ID:-}"
"""

[tasks.claim-seed]
description = "Seed a workshop's claim pool from the subscription/ outputs (writes CRED# items; requires WORKSHOP_ID; conditional, safe to re-run)"
dir = "claim-service/scripts"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi
# Derive this workshop's table name (R6.5, R7.6); the script errors if that
# workshop's table does not exist, touching no other workshop's table (R7.7).
python seed_claim_pool.py \
  --otp-csv ../../subscription/output/otps.csv \
  --manifest ../../subscription/output/manifest.json \
  --table "credential-claim-${WID}" \
  --apply
"""

# --- 4. Audit (after the workshop, before teardown) --------------------------
[tasks.claim-audit]
description = "Export who claimed what for a workshop to a git-ignored CSV under claim-service/output/ (PII — not committed; requires WORKSHOP_ID)"
dir = "claim-service/scripts"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi
# Derive this workshop's table name (R6.6, R7.6); the script errors if that
# workshop's table does not exist, reading no other workshop's table (R7.7).
TABLE_NAME="credential-claim-${WID}" python export_audit.py
"""

# --- 5. Destroy --------------------------------------------------------------
[tasks.claim-destroy]
description = "Tear down a workshop's claim service (table, Lambda, Function URL); never touches subscription/ identities (requires WORKSHOP_ID; prompts to confirm)"
dir = "claim-service/terraform"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi

# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
if [ -f backend.hcl ] && grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi

# workshop_id namespaces the resources; workshop_code is required by the stack
# even to destroy (it is a required var), so export it from the env so destroy
# does not prompt. The two stay distinct values (R9.4, R9.5).
export TF_VAR_workshop_id="$WID"
export TF_VAR_workshop_code="${WORKSHOP_CODE:-unused-at-destroy}"
# Reconfigure to THIS workshop's claim-service key BEFORE destroy (R6.2); fail
# closed (R6.3).
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=workshops/${WID}/claim-service/terraform.tfstate" \
  || { echo "ERROR: backend reconfiguration failed; not destroying." >&2; exit 1; }
tofu destroy
"""

# =============================================================================
# === foundation/ stack ===
# =============================================================================
# ADOPTS (reads) the management account's organization IdC instance — the
# single, long-lived, shared resource every workshop's subscription stack
# consumes. Read ONCE and reused across every workshop (NOT per workshop); it
# creates and owns nothing. Runs in the management account; AWS_PROFILE must be
# a management-account profile. Excluded from every per-workshop
# provision/teardown task. backend.hcl must exist first (written by
# `mise run backend-bootstrap`, same shared bucket as the other stacks).

[tasks.foundation-plan]
description = "DRY RUN: tofu init + plan to read the org IdC instance (a pure read; creates nothing)"
dir = "foundation/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: foundation/terraform/backend.hcl not found." >&2
  echo "Run the backend bootstrap first (it writes this file):" >&2
  echo "  mise run backend-bootstrap" >&2
  echo "or copy the template by hand: cp backend.hcl.example backend.hcl" >&2
  exit 1
fi
# A residual 'key' in backend.hcl conflicts with the init-time key (R4.7).
if grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=foundation/terraform.tfstate" \
  || { echo "ERROR: backend init failed; not planning." >&2; exit 1; }
tofu plan
"""

[tasks.foundation-apply]
description = "Apply: resolve the org IdC instance IDs and print the wire-forward exports (reads the instance; creates nothing)"
dir = "foundation/terraform"
run = """
set -eu
if [ ! -f backend.hcl ]; then
  echo "ERROR: foundation/terraform/backend.hcl not found (see foundation-plan)." >&2
  exit 1
fi
if grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=foundation/terraform.tfstate" \
  || { echo "ERROR: backend init failed; not applying." >&2; exit 1; }
tofu apply
# Only reached after a clean apply (set -eu). Surface the values to wire forward.
echo ""
echo "Foundation IdC applied. Wire these into the subscription stack:"
echo "  export TF_VAR_idc_instance_arn=\"$(tofu output -raw instance_arn)\""
echo "  export TF_VAR_identity_store_id=\"$(tofu output -raw identity_store_id)\""
echo "Sign-in URL: $(tofu output -raw sign_in_url)  (region: $(tofu output -raw region))"
"""

[tasks.foundation-destroy]
description = "NO-OP: foundation adopts the org IdC instance read-only and owns nothing to destroy. Disabling IdC is a mgmt-account console action, never a task."
dir = "foundation/terraform"
run = """
set -eu
# The foundation stack ADOPTS (reads) the management account's organization IdC
# instance via `data "aws_ssoadmin_instances"`; it never creates or owns it, so
# there is nothing for a destroy to remove. This task is a deliberate, documented
# no-op that deletes NOTHING. It exists only to make that explicit and to catch
# muscle memory from the old create-and-own design.
#
# The shared organization instance belongs to every workshop. Disabling IAM
# Identity Center is a deliberate console action in the management account, done
# only when no workshop depends on the directory — never a repo task. See
# foundation/RUNBOOK.md ("Teardown — nothing to destroy here").
echo "foundation-destroy is a no-op: foundation reads the org IdC instance and owns nothing to destroy."
echo "Disabling IAM Identity Center is a management-account console action; this task deletes nothing."
"""

# =============================================================================
# === governance/ stack ===
# =============================================================================
# Standalone, MANAGEMENT-ACCOUNT-scoped stack: one OU per workshop, a Kiro
# guardrail SCP on the OU, an unattached deny-all freeze SCP, a least-privilege
# budgets execution role, and per-account budgets whose breach AUTOMATICALLY
# attaches the freeze SCP to the single breaching account. High blast radius —
# apply mutates the live AWS Organizations management account. backend.hcl must
# exist first (written by `mise run backend-bootstrap`, same shared bucket as
# the other stacks). Namespaced per workshop by WORKSHOP_ID, exactly like the
# subscription/ and claim-service/ stacks. There is intentionally NO un-freeze
# task: recovering a frozen account is a deliberate manual detach (see
# governance/RUNBOOK.md).

[tasks.governance-plan]
description = "DRY RUN: tofu init + plan for a workshop's governance stack (requires WORKSHOP_ID; creates nothing)"
dir = "governance/terraform"
run = """
set -eu
# --- WORKSHOP_ID guard (R6.1, R6.7, R8.4) --------------------------------------
WID="$(printf '%s' "${WORKSHOP_ID:-}" | tr -d '[:space:]')"
if [ -z "$WID" ]; then
  echo "ERROR: WORKSHOP_ID is required (unset or whitespace-only)." >&2
  echo "Set it in the git-ignored .env (see .env.example), e.g.:" >&2
  echo "  WORKSHOP_ID=kiro-2025-10-10" >&2
  exit 1
fi
if ! printf '%s' "$WID" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' \
   || printf '%s' "$WID" | grep -q -- '--'; then
  echo "ERROR: WORKSHOP_ID '$WID' is not a valid slug." >&2
  echo "Expected: 1-63 lowercase alphanumeric characters and hyphens, starting" >&2
  echo "and ending alphanumeric, with no consecutive hyphens." >&2
  exit 1
fi
if [ ! -f backend.hcl ]; then
  echo "ERROR: governance/terraform/backend.hcl not found." >&2
  echo "Run the backend bootstrap first (it writes this file):" >&2
  echo "  mise run backend-bootstrap" >&2
  echo "or copy the template by hand: cp backend.hcl.example backend.hcl" >&2
  exit 1
fi
# A residual 'key' in backend.hcl conflicts with the init-time key (R5.9).
if grep -Eq '^[[:space:]]*key[[:space:]]*=' backend.hcl; then
  echo "ERROR: remove the 'key' line from backend.hcl; it is supplied at init time." >&2
  exit 1
fi
export TF_VAR_workshop_id="$WID"
# Reconfigure to THIS workshop's governance key BEFORE plan (R6.2); fail
# closed (R6.3).
tofu init -reconfigure -input=false -backend-config=backend.hcl \
  -backend-config="key=workshops/${WID}/governance/terraform.tfstate" \
  || { echo "ERROR: backend init failed; not planning." >&2; exit 1; }
tofu plan
"""

[tasks.governance-apply]
description = "Apply: create (or re-converge) a workshop's OU, guardrail SCP, freeze SCP, budgets role, and per-account budgets (requires WORKSHOP_ID; prompts to approve)"
